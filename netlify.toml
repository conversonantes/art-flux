# art-flux en Netlify: la web (Vite) y la API (una sola función en /api/*).
# Pasos y variables: docs/despliegue.md

[build]
  command = "pnpm --filter @art-flux/web build && pnpm build:api"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # SUPABASE_URL y SUPABASE_ANON_KEY viajan al navegador a propósito (la llave anon es pública por
  # diseño; RLS protege los datos). Sin esto, Netlify frena el build al encontrarlas en el paquete.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

# La API: todo /api/* es la función (que ya viene empaquetada en netlify/functions/api.mjs).
# La ruta también está declarada en la propia función; esta regla es la red de seguridad.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Cualquier dirección de la app (/grupo/obra/s02…) carga la misma página; el router decide.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # Cámara y micrófono solo para este sitio (foto y nota de voz).
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"

# Los archivos con huella en el nombre nunca cambian.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
