<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Crear grupo · art-flux</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}a{color:#17725A}a:hover{color:#1E1E1C}</style>
</head>
<body style="margin:0;background:#E9E9E4">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F1; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1E1E1C; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px">
    <a href="hu-02-sin-grupo.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DADAD3; background: #FFFFFF; color: #1E1E1C; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #63635C">grupos/nuevo</span>
  </div>

  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 28px; flex-grow: 1">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-weight: 800; font-size: 36px; line-height: 1.02; letter-spacing: -0.02em">Abre tu grupo</h1>
      <p style="margin: 0; font-family: 'Source Serif 4', serif; font-size: 17px; line-height: 1.5; color: #3C3C38">Aquí va a vivir el proceso: obras, sesiones y ejercicios.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px">
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 15px; font-weight: 700">Nombre del grupo</span>
        <input type="text" value="Conversonantes" style="min-height: 52px; padding: 0 14px; border-radius: 14px; border: 2px solid #1E1E1C; background: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; color: #1E1E1C; box-sizing: border-box">
      </label>
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 15px; font-weight: 700">Ciudad <span style="font-weight: 400; color: #63635C">· opcional</span></span>
        <input type="text" value="Medellín" style="min-height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid #DADAD3; background: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; color: #1E1E1C; box-sizing: border-box">
      </label>
    </div>

    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DADAD3">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: #17725A; color: #FFFFFF; flex-shrink: 0">admin</span>
      <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #3C3C38">Quedas como admin: invitas, creas obras y decides qué se publica. Todo nace privado.</p>
    </div>

    <div style="flex-grow: 1"></div>
  </div>

  <div style="padding: 16px 20px 32px">
    <a href="hu-03-invitar.html" style="min-height: 56px; border-radius: 16px; background: #1E1E1C; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Crear grupo</a>
  </div>
</div>
</body>
</html>
