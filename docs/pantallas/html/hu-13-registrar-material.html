<body style="margin:0;background:#E9E9E4">
<div style="width: 390px; min-height: 960px; box-sizing: border-box; background: #F4F4F1; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1E1E1C; display: flex; flex-direction: column">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #63635C">registrar · cristina/S02</span>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">¿Dónde va?</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <button style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #DADAD3; background: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; color: #1E1E1C">Sesión</button>
        <button aria-pressed="true" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 2px solid #1E1E1C; background: #F1DE45; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 700; color: #1E1E1C">P1 · Calentamiento</button>
        <button style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #DADAD3; background: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; color: #1E1E1C">P2 · Impro</button>
        <button style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #DADAD3; background: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; color: #1E1E1C">P3 · Análisis</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="min-height: 104px; border-radius: 18px; border: none; background: #1E1E1C; color: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 700; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 16px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F1DE45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Tomar foto</button>
      <button style="min-height: 104px; border-radius: 18px; border: none; background: #1E1E1C; color: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 700; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 16px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F1DE45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>Grabar audio</button>
      <button style="min-height: 104px; border-radius: 18px; border: 1px solid #DADAD3; background: #FFFFFF; color: #1E1E1C; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 700; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 16px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"></path><path d="M14 3v5h5"></path></svg>Subir archivo</button>
      <button style="min-height: 104px; border-radius: 18px; border: 1px solid #DADAD3; background: #FFFFFF; color: #1E1E1C; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 700; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 16px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>Pegar enlace</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 15px; font-weight: 700">En este planteamiento</span>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DADAD3">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 40px; height: 40px; border-radius: 10px; background: #F1DE45; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1E1C" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
            <span style="font-size: 15px; font-weight: 600">Descripción del calentamiento</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63635C">audio · [2:14] · manu · subiendo</span>
          </span>
        </div>
        <div style="height: 6px; border-radius: 3px; background: #EDEDE8; display: flex; overflow: hidden"><span style="width: 64%; background: #1E1E1C"></span></div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DADAD3">
        <span style="width: 40px; height: 40px; border-radius: 10px; background: #EDEDE8; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1E1C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M20.5 15.5l-5-5L6 19.5"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
          <span style="font-size: 15px; font-weight: 600">Parada de cabeza</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63635C">foto · manu · hace 3 min</span>
        </span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.45; color: #3C3C38">
      <span style="display: flex; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#63635C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Solo el grupo lo ve, como la sesión.</span>
      <span style="display: flex; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#63635C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg>Hasta [N] MB por archivo. Las fotos se comprimen antes de subir.</span>
    </div>
  </div>
  <div style="flex-grow: 1; min-height: 32px"></div>
</div>
