<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Comentarios · art-flux</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}a{color:#17725A}a:hover{color:#1E1E1C}</style>
</head>
<body style="margin:0;background:#E9E9E4">
<div style="width: 390px; min-height: 1000px; box-sizing: border-box; background: #F4F4F1; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1E1E1C; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px">
    <a href="hu-16-bitacora.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DADAD3; background: #FFFFFF; color: #1E1E1C; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #63635C">cristina/S02/P3</span>
  </div>

  <div style="padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #DADAD3">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63635C">P3 · santi · análisis</span>
    <h1 style="margin: 0; font-weight: 700; font-size: 24px; line-height: 1.15">Análisis de acciones por personaje</h1>
    <p style="margin: 0; font-family: 'Source Serif 4', serif; font-size: 17px; line-height: 1.5">Acciones muy claras. <span style="background: linear-gradient(transparent 52%, #F1DE45 52%, #F1DE45 92%, transparent 92%); padding: 0 2px">Los caracteres empiezan a separarse.</span></p>
  </div>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <h2 style="margin: 0; font-weight: 700; font-size: 19px">Comentarios <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 400; color: #63635C">· 2</span></h2>

    <div style="display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px">
      <span style="width: 36px; height: 36px; border-radius: 50%; background: #D47A22; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">M</span>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px"><b>Manu</b> <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63635C">· [fecha]</span></span>
        <p style="margin: 0; font-family: 'Source Serif 4', serif; font-size: 16px; line-height: 1.5">[Comentario de Manu sobre el hallazgo]</p>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px">
      <span style="width: 36px; height: 36px; border-radius: 50%; background: #1E1E1C; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">S</span>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px"><b>Santi</b> <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63635C">· [fecha] · tú</span></span>
        <p style="margin: 0; font-family: 'Source Serif 4', serif; font-size: 16px; line-height: 1.5">[Tu respuesta]</p>
        <div style="display: flex; gap: 4px">
          <button style="min-height: 36px; padding: 0 8px; border: none; background: transparent; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 600; color: #17725A">Editar</button>
          <button style="min-height: 36px; padding: 0 8px; border: none; background: transparent; font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; color: #A3361F">Borrar</button>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 24px"></div>

  <div style="padding: 12px 16px 28px; background: #FFFFFF; border-top: 1px solid #DADAD3; display: flex; align-items: flex-end; gap: 10px">
    <label style="flex-grow: 1; display: flex">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Comentario</span>
      <textarea rows="2" placeholder="Suma tu mirada" style="flex-grow: 1; padding: 12px 14px; border-radius: 14px; border: 1px solid #DADAD3; background: #F4F4F1; font-family: 'Source Serif 4', serif; font-size: 16px; line-height: 1.4; color: #1E1E1C; resize: none; box-sizing: border-box"></textarea>
    </label>
    <button aria-label="Enviar comentario" style="width: 52px; height: 52px; border-radius: 14px; border: none; background: #1E1E1C; color: #F1DE45; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </button>
  </div>
</div>
</body>
</html>
