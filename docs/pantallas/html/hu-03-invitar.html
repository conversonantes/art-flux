<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Invitar con enlace · art-flux</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}a{color:#17725A}a:hover{color:#1E1E1C}</style>
</head>
<body style="margin:0;background:#E9E9E4">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F1; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1E1E1C; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px">
    <img src="logo-conversonantes.jpg" alt="Conversonantes" style="width: 44px; height: 44px; border-radius: 12px; object-fit: cover; object-position: 45% 50%; background: #000">
    <div style="display: flex; flex-direction: column">
      <span style="font-weight: 700; font-size: 16px">Conversonantes</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63635C">medellín · grupo creado</span>
    </div>
  </div>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 24px; flex-grow: 1">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-weight: 800; font-size: 36px; line-height: 1.02; letter-spacing: -0.02em">Invita a tu gente</h1>
      <p style="margin: 0; font-family: 'Source Serif 4', serif; font-size: 17px; line-height: 1.5; color: #3C3C38">Quien abra el enlace y entre con Google queda como miembro.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #DADAD3">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63635C">enlace de invitación</span>
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="flex-grow: 1; font-family: 'JetBrains Mono', monospace; font-size: 15px; padding: 12px; border-radius: 10px; background: #F4F4F1">art-flux.app/i/[código]</span>
        <button aria-label="Copiar enlace" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #DADAD3; background: #FFFFFF; color: #1E1E1C; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"></path></svg>
        </button>
      </div>
      <button style="min-height: 52px; border-radius: 14px; border: none; background: #1E1E1C; color: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"></path><path d="M5 13v6.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V13"></path></svg>
        Compartir por WhatsApp
      </button>
      <button style="min-height: 44px; border: none; background: transparent; color: #17725A; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 600">Anular este enlace y generar otro</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-weight: 700; font-size: 18px">Ya entraron</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63635C">2 por enlace</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #DADAD3">
        <span style="width: 36px; height: 36px; border-radius: 50%; background: #D47A22; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">M</span>
        <span style="flex-grow: 1; font-size: 16px">Manu</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63635C">miembro</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #DADAD3">
        <span style="width: 36px; height: 36px; border-radius: 50%; background: #F1DE45; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">K</span>
        <span style="flex-grow: 1; font-size: 16px">Kokoro</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63635C">miembro</span>
      </div>
    </div>
    <div style="flex-grow: 1"></div>
  </div>

  <div style="padding: 16px 20px 32px">
    <a href="hu-09-inicio.html" style="min-height: 56px; border-radius: 16px; border: 1.5px solid #1E1E1C; color: #1E1E1C; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Ir al grupo</a>
  </div>
</div>
</body>
</html>
