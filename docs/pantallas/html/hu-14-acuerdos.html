<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Acuerdos, tareas e imprevistos · art-flux</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}a{color:#17725A}a:hover{color:#1E1E1C}</style>
</head>
<body style="margin:0;background:#E9E9E4">
<div style="width: 390px; min-height: 1000px; box-sizing: border-box; background: #F4F4F1; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1E1E1C; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px">
    <a href="hu-16-bitacora.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DADAD3; background: #FFFFFF; color: #1E1E1C; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #63635C; flex-grow: 1">cristina/S02/cierre</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #17725A">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>guardado</span>
  </div>

  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">Lo que deja la sesión</h1>
    <p style="margin: 0; font-family: 'Source Serif 4', serif; font-size: 16px; line-height: 1.45; color: #3C3C38">Para que la próxima empiece donde esta terminó.</p>
  </div>

  <div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 26px">
    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 17px; font-weight: 700">Acuerdos</span>
      <textarea rows="3" placeholder="Lo que decidimos juntos" style="padding: 12px 14px; border-radius: 14px; border: 1px solid #DADAD3; background: #FFFFFF; font-family: 'Source Serif 4', serif; font-size: 16px; line-height: 1.5; color: #1E1E1C; resize: none; box-sizing: border-box">[Acuerdos de la sesión 2]</textarea>
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 17px; font-weight: 700">Tareas para la próxima</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63635C">3</span>
      </div>
      <div style="display: flex; flex-direction: column; border-top: 1px solid #DADAD3">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid #DADAD3">
          <input type="checkbox" aria-label="Hecha" style="width: 22px; height: 22px; accent-color: #1E1E1C">
          <span style="flex-grow: 1; font-size: 16px; line-height: 1.3">Traer el étude de análisis activo</span>
          <span style="width: 32px; height: 32px; border-radius: 50%; background: #1E1E1C; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center" aria-label="Santi">S</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid #DADAD3">
          <input type="checkbox" aria-label="Hecha" style="width: 22px; height: 22px; accent-color: #1E1E1C">
          <span style="flex-grow: 1; font-size: 16px; line-height: 1.3">Describir el calentamiento</span>
          <span style="width: 32px; height: 32px; border-radius: 50%; background: #D47A22; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center" aria-label="Manu">M</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid #DADAD3">
          <input type="checkbox" aria-label="Hecha" style="width: 22px; height: 22px; accent-color: #1E1E1C">
          <span style="flex-grow: 1; font-size: 16px; line-height: 1.3">Describir el 1-2-3 en pareja</span>
          <span style="width: 32px; height: 32px; border-radius: 50%; background: #F1DE45; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center" aria-label="Kokoro">K</span>
        </div>
        <button style="min-height: 52px; border: none; background: transparent; text-align: left; padding: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 600; color: #17725A">+ Agregar tarea</button>
      </div>
      <span style="font-size: 13px; color: #63635C">Las tareas con responsable aparecen en su inicio.</span>
    </div>

    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 17px; font-weight: 700">Imprevistos</span>
      <textarea rows="2" placeholder="Lo que no salió como estaba planeado" style="padding: 12px 14px; border-radius: 14px; border: 1px solid #DADAD3; background: #FFFFFF; font-family: 'Source Serif 4', serif; font-size: 16px; line-height: 1.5; color: #1E1E1C; resize: none; box-sizing: border-box">Cierre forzado por la lluvia.</textarea>
    </label>
  </div>

  <div style="flex-grow: 1; min-height: 24px"></div>
  <div style="padding: 16px 20px 32px">
    <a href="hu-16-bitacora.html" style="min-height: 56px; border-radius: 16px; background: #1E1E1C; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Ver la bitácora</a>
  </div>
</div>
</body>
</html>
