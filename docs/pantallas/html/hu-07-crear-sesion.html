<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Crear sesión · art-flux</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}a{color:#17725A}a:hover{color:#1E1E1C}</style>
</head>
<body style="margin:0;background:#E9E9E4">
<div style="width: 390px; min-height: 960px; box-sizing: border-box; background: #F4F4F1; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1E1E1C; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px">
    <a href="hu-05-obra.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DADAD3; background: #FFFFFF; color: #1E1E1C; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #63635C">cristina/sesiones/nueva</span>
  </div>

  <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">Nueva sesión</h1>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; padding: 4px 8px; border-radius: 6px; background: #1E1E1C; color: #FFFFFF">S02</span>
    </div>

    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">Pertenece a</span>
      <span style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid #DADAD3; background: #FFFFFF">
        <span style="font-size: 16px">Obra · <i style="font-family: 'Source Serif 4', serif">Cristina</i></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </span>
      <span style="font-size: 13px; color: #63635C">O déjala como sesión del grupo, si todavía no hay obra.</span>
    </label>

    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 15px; font-weight: 700; padding: 0 0 8px">Fecha</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: 14px; background: #EAEAE5">
        <button style="min-height: 44px; border-radius: 10px; border: none; background: transparent; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; color: #1E1E1C">Hoy</button>
        <button aria-pressed="true" style="min-height: 44px; border-radius: 10px; border: none; background: #FFFFFF; box-shadow: 0 1px 3px #1E1E1C26; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 700; color: #1E1E1C">Otra fecha</button>
        <button style="min-height: 44px; border-radius: 10px; border: none; background: transparent; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; color: #1E1E1C">Pendiente</button>
      </div>
      <span style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 14px; border-radius: 14px; border: 2px solid #1E1E1C; background: #FFFFFF">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px">[dd/mm/2026]</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
      </span>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #3C3C38"><span style="padding: 1px 6px; background: #F1DE45; font-family: 'JetBrains Mono', monospace; font-size: 12px">pasada</span>Sirve para registrar una sesión que ya ocurrió.</span>
    </fieldset>

    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">Lugar</span>
      <input type="text" value="Universidad Nacional" style="min-height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid #DADAD3; background: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; color: #1E1E1C; box-sizing: border-box">
    </label>

    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">Objetivo</span>
      <textarea rows="3" style="padding: 12px 14px; border-radius: 14px; border: 1px solid #DADAD3; background: #FFFFFF; font-family: 'Source Serif 4', serif; font-size: 16px; line-height: 1.5; color: #1E1E1C; resize: none; box-sizing: border-box">Analizar el texto, trabajar sus puntos fuertes y seguir ahondando.</textarea>
    </label>
  </div>

  <div style="flex-grow: 1; min-height: 24px"></div>
  <div style="padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 8px">
    <a href="hu-08-planteamientos.html" style="min-height: 56px; border-radius: 16px; background: #1E1E1C; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Crear y agregar planteamientos</a>
    <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63635C">nace como planeada</span>
  </div>
</div>
</body>
</html>
