<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Crear obra · art-flux</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}a{color:#17725A}a:hover{color:#1E1E1C}</style>
</head>
<body style="margin:0;background:#E9E9E4">
<div style="width: 390px; min-height: 1000px; box-sizing: border-box; background: #F4F4F1; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1E1E1C; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px">
    <a href="hu-05-obra.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DADAD3; background: #FFFFFF; color: #1E1E1C; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #63635C">conversonantes/obras/nueva</span>
  </div>

  <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 22px">
    <h1 style="margin: 0; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">Nueva obra</h1>

    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">Título</span>
      <input type="text" value="Cristina" style="min-height: 52px; padding: 0 14px; border-radius: 14px; border: 2px solid #1E1E1C; background: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; color: #1E1E1C; box-sizing: border-box">
    </label>

    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 15px; font-weight: 700; padding: 0 0 8px">Estado</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="min-height: 44px; border-radius: 12px; border: 1px solid #DADAD3; background: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; color: #1E1E1C">En búsqueda</button>
        <button aria-pressed="true" style="min-height: 44px; border-radius: 12px; border: 2px solid #1E1E1C; background: #F1DE45; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 700; color: #1E1E1C">En montaje</button>
        <button style="min-height: 44px; border-radius: 12px; border: 1px solid #DADAD3; background: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; color: #1E1E1C">En temporada</button>
        <button style="min-height: 44px; border-radius: 12px; border: 1px solid #DADAD3; background: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; color: #1E1E1C">Archivada</button>
      </div>
    </fieldset>

    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">Temas</span>
      <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 52px; padding: 8px 10px; border-radius: 14px; border: 1px solid #DADAD3; background: #FFFFFF; box-sizing: border-box">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 4px 8px; border-radius: 6px; background: #F4F4F1">#[tema] ×</span>
        <input type="text" placeholder="Escribe y pulsa enter" style="border: none; outline: none; flex-grow: 1; min-width: 120px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px">
      </span>
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">Nace de una sesión del grupo <span style="font-weight: 400; color: #63635C">· opcional</span></span>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border-radius: 14px; border: 1px solid #DADAD3; background: #FFFFFF">
        <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #1E1E1C">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 600">S01 · Reencuentro</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63635C">sesión de búsqueda · se vuelve el origen</span>
        </span>
      </label>
    </div>

    <label style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">Acuerdo de visibilidad</span>
      <textarea rows="4" placeholder="Qué acordamos mostrar fuera del grupo y qué no" style="padding: 12px 14px; border-radius: 14px; border: 1px solid #DADAD3; background: #FFFFFF; font-family: 'Source Serif 4', serif; font-size: 16px; line-height: 1.5; color: #1E1E1C; resize: none; box-sizing: border-box"></textarea>
      <span style="font-size: 13px; color: #63635C">Nada se publica todavía: la obra nace privada.</span>
    </label>
  </div>

  <div style="flex-grow: 1; min-height: 24px"></div>
  <div style="padding: 16px 20px 32px">
    <a href="hu-05-obra.html" style="min-height: 56px; border-radius: 16px; background: #1E1E1C; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Crear obra</a>
  </div>
</div>
</body>
</html>
